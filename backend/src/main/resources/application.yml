spring:
  application:
    name: vms-workflow-backend
  datasource:
    url: ${VMS_DATABASE_URL}
    username: ${VMS_DATABASE_USERNAME}
    password: ${VMS_DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${VMS_FINANCE_MAX_FILE_SIZE:25MB}
      max-request-size: ${VMS_FINANCE_MAX_REQUEST_SIZE:26MB}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${VMS_OIDC_JWKS_URI}

vms:
  security:
    audience: ${VMS_OIDC_AUDIENCE}
    issuer: ${VMS_OIDC_ISSUER}
  certification:
    token-ttl: ${VMS_CERTIFICATION_TOKEN_TTL:PT72H}
    default-confirmation-due: ${VMS_CERTIFICATION_CONFIRMATION_DUE:PT120H}
    token-work-factor: ${VMS_CERTIFICATION_TOKEN_WORK_FACTOR:120000}
    email-provider-status: ${VMS_CERTIFICATION_EMAIL_PROVIDER_STATUS:NOT_CONFIGURED}
    token-handoff-key: ${VMS_CERTIFICATION_TOKEN_HANDOFF_KEY:}
    token-handoff-key-version: ${VMS_CERTIFICATION_TOKEN_HANDOFF_KEY_VERSION:local-v1}
    inbound-signing-secret: ${VMS_CERTIFICATION_INBOUND_SIGNING_SECRET:}
    inbound-replay-window: ${VMS_CERTIFICATION_INBOUND_REPLAY_WINDOW:PT5M}
    rate-limit:
      mutations-per-minute: ${VMS_CERTIFICATION_MUTATIONS_PER_MINUTE:120}
      actions-per-minute: ${VMS_CERTIFICATION_ACTIONS_PER_MINUTE:20}
      inbound-per-minute: ${VMS_CERTIFICATION_INBOUND_PER_MINUTE:30}
      replays-per-minute: ${VMS_CERTIFICATION_REPLAYS_PER_MINUTE:10}
    object-storage-provider-status: ${VMS_CERTIFICATION_OBJECT_STORAGE_STATUS:NOT_CONFIGURED}
    f05-handoff-status: ${VMS_CERTIFICATION_F05_HANDOFF_STATUS:NOT_CONFIGURED}
  finance:
    local-scanner-enabled: ${VMS_FINANCE_LOCAL_SCANNER_ENABLED:false}
    cursor-signing-secret: ${VMS_FINANCE_CURSOR_SIGNING_SECRET:}
    cursor-ttl: ${VMS_FINANCE_CURSOR_TTL:PT30M}
    rate-limit:
      mutations-per-minute: ${VMS_FINANCE_MUTATIONS_PER_MINUTE:120}
      downloads-per-minute: ${VMS_FINANCE_DOWNLOADS_PER_MINUTE:60}
      exports-per-minute: ${VMS_FINANCE_EXPORTS_PER_MINUTE:20}
  migration:
    local-scanner-enabled: ${VMS_MIGRATION_LOCAL_SCANNER_ENABLED:false}
    retention-days: ${VMS_MIGRATION_RETENTION_DAYS:2555}
    worker-enabled: ${VMS_MIGRATION_WORKER_ENABLED:false}
    worker-delay: ${VMS_MIGRATION_WORKER_DELAY:PT30S}
    worker-initial-delay: ${VMS_MIGRATION_WORKER_INITIAL_DELAY:PT30S}
    worker-batch-size: ${VMS_MIGRATION_WORKER_BATCH_SIZE:5}
    worker-lease-seconds: ${VMS_MIGRATION_WORKER_LEASE_SECONDS:120}
    worker-recovery-age-seconds: ${VMS_MIGRATION_WORKER_RECOVERY_AGE_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
