services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vms_workflow
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms_workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vms-postgres:/var/lib/postgresql/data

volumes:
  vms-postgres:
