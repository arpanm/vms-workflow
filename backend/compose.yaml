services:
  postgres:
    image: cgr.dev/chainguard/postgres@sha256:dc2f04037c1044a22af76cee4de70b9111885b17c561b939d7ed70103d100759
    environment:
      POSTGRES_DB: vms_workflow
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms_workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3m
    volumes:
      - vms-postgres:/var/lib/postgresql

volumes:
  vms-postgres:
