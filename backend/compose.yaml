services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: vms_workflow
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms_workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3m
    volumes:
      - vms-postgres:/var/lib/postgresql

volumes:
  vms-postgres:
